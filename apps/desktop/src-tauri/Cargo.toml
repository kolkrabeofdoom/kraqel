[package]
name = "kraqel-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "kraqel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
isolation-ui-test = ["dep:kraqel-isolation-test-adapter"]

[target.'cfg(windows)'.dependencies]
kraqel-archiv = { path = "../../../crates/portable-archive" }
tempfile = "3"
tokio = { version = "1", features = ["time"] }
winapi-util = "0.1"
kraqel-isolation-probe = { path = "../../../scripts/runtime-isolation/probe", features = ["desktop-review"] }
kraqel-isolation-test-adapter = { path = "../isolation-test-adapter", optional = true }

[dependencies]
base64 = "0.22"
kraqel-ai-service = { path = "../../../crates/ai-service" }
kraqel-asset-service = { path = "../../../crates/asset-service" }
kraqel-continuity = { path = "../../../crates/continuity" }
kraqel-domain = { path = "../../../crates/domain" }
kraqel-export = { path = "../../../crates/export" }
kraqel-git-service = { path = "../../../crates/git-service" }
kraqel-storage = { path = "../../../crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["serde"] }
zeroize = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
