[package]
name = "kraqel-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kraqel-domain = { path = "../domain" }
kraqel-asset-service = { path = "../asset-service" }
lopdf = { version = "0.47", default-features = false }
printpdf = { version = "0.12.14", default-features = false }
ttf-parser = "=0.19.2"
unicode-normalization = "=0.1.25"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
quick-xml = { version = "0.42", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
