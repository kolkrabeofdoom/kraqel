[package]
name = "kraqel-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kraqel-domain = { path = "../domain" }
kraqel-asset-service = { path = "../asset-service" }
printpdf = { version = "0.7.0", default-features = false }
quick-xml = { version = "0.42", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
