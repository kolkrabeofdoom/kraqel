[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/asset-service",
  "crates/continuity",
  "crates/domain",
  "crates/export",
  "crates/git-service",
  "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kolkrabeofdoom/kraqel"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
