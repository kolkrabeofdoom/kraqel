name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev
          librsvg2-dev libdbus-1-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify experimental DOCX structure fixtures
        run: python -m unittest discover -s scripts/docx-prototype -v
      - run: pnpm --filter @kraqel/desktop build
      - run: cargo build --workspace

      - name: Install Playwright Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @kraqel/desktop exec playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os == 'Windows'
        run: pnpm --filter @kraqel/desktop exec playwright install chromium

      - name: Run browser E2E
        run: pnpm --filter @kraqel/desktop test:e2e

  dependency-review:
    name: Dependency review
    # GitHub stellt Dependency Review für private Repositories nur mit Advanced Security bereit.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
