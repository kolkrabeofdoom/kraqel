[package]
name = "kraqel-window-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# Dedicated synthetic service binaries for the two durable commit boundaries.
probe-stop-before-snapshot = []
probe-stop-after-snapshot = []
probe-stop-mid-snapshot = []

[dependencies]
rusqlite = {version = "=0.39.0", features=["bundled","serialize"]}
kraqel-native-scene-model = { path = "../native-scene-model" }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
