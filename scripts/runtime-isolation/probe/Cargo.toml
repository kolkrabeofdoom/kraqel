[package]
name = "kraqel-isolation-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

# Research tool only. Never linked into or packaged with the desktop application.
[workspace]

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
kraqel-isolation-test-adapter = { path = "../../../apps/desktop/isolation-test-adapter" }
kraqel-storage = { path = "../../../crates/storage" }
kraqel-domain = { path = "../../../crates/domain" }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects"] }
